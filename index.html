
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WishlistZone | Testimonial Gallery</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="container">

    <header class="header">
      <img src="images/logo.png"
           alt="Logo WishlistZone"
           class="logo">

      <div class="brand">
        <h1>WishlistZone ♡</h1>
        <p>TESTIMONIAL GALLERY</p>
      </div>
    </header>

    <section class="hero">
      <h2>Sweet Reviews ♡</h2>
      <p>Thank you for trusting WishlistZone!</p>
      <div class="decoration">✧ ♡ 🎀 ♡ ✧</div>
    </section>

    <nav class="months" id="months"></nav>

    <section class="gallery-heading">
      <h3 id="galleryTitle">Testimoni Januari ♡</h3>
      <p id="galleryCount"></p>
    </section>

    <section class="gallery" id="gallery"></section>

    <div class="empty" id="empty">
      ♡ Belum ada testimoni di bulan ini ♡
    </div>

    <footer>
      Made with ♡ by WishlistZone 🎀
    </footer>

  </div>

  <div class="lightbox" id="lightbox">
    <button id="closeLightbox" aria-label="Tutup foto">×</button>
    <img id="largeImage" src="" alt="Foto testimoni">
  </div>

</body>
</html>
